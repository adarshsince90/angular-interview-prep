name: CI / CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/portal/package-lock.json

      - name: Install Dependencies
        working-directory: apps/portal
        run: npm ci

      - name: Verify Content Manifest & Integrity
        working-directory: apps/portal
        run: npm run test:integrity

      - name: Run Angular Unit Tests
        working-directory: apps/portal
        run: npm test

      - name: Build Angular Portal for GitHub Pages
        working-directory: apps/portal
        run: npm run build:pages

      - name: Setup SPA Deep-Linking Fallback & Disable Jekyll
        run: |
          cp apps/portal/dist/portal/browser/index.html apps/portal/dist/portal/browser/404.html
          touch apps/portal/dist/portal/browser/.nojekyll

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/portal/dist/portal/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
